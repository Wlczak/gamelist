services:
    gamelist-nginx:
        container_name: gamelist-nginx
        image: nginx:1.29-alpine-slim
        build:
            context: .
            dockerfile: Dockerfile
            target: gamelist-nginx
        ports:
            - "9000:80"
        volumes:
            - ./phpdocker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - gamelist
        restart: always

    gamelist:
        container_name: gamelist-app
        image: wlczak/gamelist:latest
        build:
            context: .
            dockerfile: Dockerfile
        init: true
        labels:
            - com.centurylinklabs.watchtower.enable=true
        # port no longer exposed publicly — nginx talks to fpm directly
        depends_on:
            - gamelist-db
        environment:
            DATABASE_URL: "mysql://root:root@gamelist-db:3306/gamelist"
        restart: always

    gamelist-db:
        container_name: gamelist-db
        image: mariadb
        volumes:
            - gamelist-data:/var/lib/mysql
            - ./db-structure:/docker-entrypoint-initdb.d/
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: gamelist
            MYSQL_USER: gamelist
            MYSQL_PASSWORD: root
        restart: always

volumes:
    gamelist-data:
